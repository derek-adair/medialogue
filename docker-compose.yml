version: "3.9"
services:
  demo:
    restart: always
    build:
        context: ./
        dockerfile: ./demo/Dockerfile
    env_file: .env-dev
    ports:
        - "8001:8001"
    links:
      - redis:redis
    volumes:
        - ./demo:/code
        - ./:/medialogue
    command: python ./manage.py runserver 0.0.0.0:8001

  testrunner:
    restart: always
    build:
        context: .
        dockerfile: Dockerfile.testrunner
    links:
      - redis:redis
    volumes:
        - .:/code
    command: bash ./testrunner.sh
    
  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    command: ["sh", "-c", "redis-server --appendonly yes"]
    volumes:
      - ./queue_data:/data

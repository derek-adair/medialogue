version: "3.9"
services:
  web:
    restart: always
    build:
      context: ./
      dockerfile: ./demo/web/ops/Dockerfile
    ports:
        - "8001:8001"
    links:
      - redis:redis
    volumes:
        - .:/code
    command: ./testrunner.sh
  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    command: ["sh", "-c", "redis-server --appendonly yes"]
    volumes:
      - ./queue_data:/data
